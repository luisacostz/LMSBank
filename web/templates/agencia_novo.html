{% extends "base.html" %}
{% block titulo %}Cadastrar agência · LMS Bank{% endblock %}

{% block conteudo %}
<div class="page-head">
  <h2>Cadastrar agência</h2>
</div>

<form class="form-ficha" method="post" action="{{ url_for('agencia_novo') }}">
  <div class="campo">
    <label for="numero_agencia">Número da agência</label>
    <input type="text" id="numero_agencia" name="numero_agencia" required placeholder="0001">
  </div>
  <div class="campo">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" required>
  </div>
  <div class="campo">
    <label for="telefone">Telefone</label>
    <input type="text" id="telefone" name="telefone" required>
  </div>
  <div class="campo">
    <label for="endereco">Endereço</label>
    <input type="text" id="endereco" name="endereco" required>
  </div>
  <button class="botao" type="submit">Cadastrar</button>
  <a class="botao secundario" href="{{ url_for('agencias') }}">Cancelar</a>
</form>
{% endblock %}
