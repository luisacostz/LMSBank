{% extends "base.html" %}
{% block titulo %}Cadastrar cliente · LMS Bank{% endblock %}

{% block conteudo %}
<div class="page-head">
  <div>
    <h2>Cadastrar cliente</h2>
  </div>
</div>

<form class="form-ficha" method="post" action="{{ url_for('cliente_novo') }}">
  <div class="campo">
    <label for="cpf">CPF</label>
    <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00">
  </div>
  <div class="campo">
    <label for="nome">Nome completo</label>
    <input type="text" id="nome" name="nome" required>
  </div>
  <div class="campo">
    <label for="data_nascimento">Data de nascimento</label>
    <input type="text" id="data_nascimento" name="data_nascimento" placeholder="DD/MM/AAAA  " required>
  </div>
  <div class="campo">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required>
  </div>
  <div class="campo">
    <label for="telefone">Telefone</label>
    <input type="text" id="telefone" name="telefone" required>
  </div>
  <div class="campo">
    <label for="endereco">Endereço</label>
    <input type="text" id="endereco" name="endereco" required>
  </div>
  <button class="botao" type="submit">Cadastrar</button>
  <a class="botao secundario" href="{{ url_for('clientes') }}">Cancelar</a>
</form>
{% endblock %}
